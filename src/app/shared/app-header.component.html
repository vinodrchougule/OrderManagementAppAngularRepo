<header class="app-header">
  <div class="header-top">
    <div class="brand">Order Management App</div>

    <div class="user-info">
      <span class="welcome-text">Welcome {{ username() }}!</span>
      <button type="button" class="logout-btn" (click)="onLogout()">Logout</button>
    </div>
  </div>

  <nav class="main-nav">
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >Home</a>
    <a routerLink="/manageorders" routerLinkActive="active" class="nav-link">Manage Orders</a>
    <a routerLink="/customers" routerLinkActive="active" class="nav-link">Customers</a>
    <a routerLink="/items" routerLinkActive="active" class="nav-link">Items</a>
  </nav>
</header>
