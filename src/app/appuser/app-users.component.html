<div class="page-wrapper">
  <app-header></app-header>

  <main class="page-content">
    <h2 class="page-title">App Users</h2>

    <div class="app-users-toolbar">
      <div class="search-group">
        <input
          type="text"
          class="search-input"
          placeholder="Search app users..."
          [value]="quickFilterText()"
          (input)="onQuickFilterInput($any($event.target).value)"
        />
        <button type="button" class="toolbar-btn" (click)="onClearSearch()">
          <i class="bi bi-eraser-fill icon-teal" aria-hidden="true"></i>
          Clear
        </button>
      </div>

      <div class="toolbar-actions">
        <button type="button" class="toolbar-btn primary" (click)="onRegisterNewUser()">
          <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
          Register New App User
        </button>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        class="app-users-grid"
        [theme]="theme"
        [rowData]="rowData()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [quickFilterText]="quickFilterText()"
        [pagination]="true"
        [paginationPageSize]="10"
        [paginationPageSizeSelector]="[10, 25, 50]"
        [domLayout]="'autoHeight'"
        [loading]="loading()"
        [animateRows]="true"
      />
    </div>

    <!-- Edit App User modal - shown only while formModalOpen() is true -->
    @if (formModalOpen()) {
    <app-app-user-form-modal
      [user]="editingUser()!"
      (closed)="onFormModalClosed()"
    ></app-app-user-form-modal>
    }

    <!-- Register New App User modal - shown only while registerModalOpen() is true -->
    @if (registerModalOpen()) {
    <app-register-modal (closed)="onRegisterModalClosed()"></app-register-modal>
    }
  </main>
</div>

<!-- Delete confirmation - a top-level overlay, shown only while confirmDeleteOpen() is true -->
@if (confirmDeleteOpen()) {
<div class="confirm-overlay" (appBackdropClose)="onConfirmDeleteNo()">
  <div class="confirm-box">
    @if (!deleteSuccessMessage()) {
    <p class="confirm-message">Are you sure, to delete this App User?</p>
    @if (deleteError()) {
    <span class="error-text">{{ deleteError() }}</span>
    }
    <div class="confirm-actions">
      <button type="button" class="toolbar-btn danger" [disabled]="deleting()" (click)="onConfirmDeleteYes()">
        <i class="bi bi-trash-fill" aria-hidden="true"></i>
        {{ deleting() ? 'Deleting...' : 'Yes' }}
      </button>
      <button type="button" class="toolbar-btn" [disabled]="deleting()" (click)="onConfirmDeleteNo()">
        <i class="bi bi-x-circle icon-gray" aria-hidden="true"></i>
        No
      </button>
    </div>
    } @else {
    <p class="confirm-message success-text">{{ deleteSuccessMessage() }}</p>
    }
  </div>
</div>
}
