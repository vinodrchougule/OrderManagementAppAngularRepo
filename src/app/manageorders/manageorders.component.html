<div class="page-wrapper">
  <app-header></app-header>

  <main class="page-content">
    <h2 class="page-title">Manage Orders</h2>

    <div class="orders-toolbar">
      <input
        type="text"
        class="search-input"
        placeholder="Search orders..."
        [value]="quickFilterText()"
        (input)="onQuickFilterInput($any($event.target).value)"
      />

      <div class="toolbar-actions">
        <div class="columns-menu">
          <button type="button" class="toolbar-btn" (click)="toggleColumnsMenu()">
            Columns
          </button>
          <div class="columns-panel" *ngIf="columnsMenuOpen()">
            <label *ngFor="let col of toggleableColumns()" class="columns-panel-item">
              <input
                type="checkbox"
                [checked]="col.visible"
                (change)="onToggleColumn(col.colId, $any($event.target).checked)"
              />
              {{ col.label }}
            </label>
          </div>
        </div>

        <button type="button" class="toolbar-btn" (click)="onRefresh()">Refresh</button>
        <button type="button" class="toolbar-btn primary" (click)="onExportExcel()">
          Export to Excel
        </button>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        class="orders-grid"
        [theme]="theme"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="10"
        [paginationPageSizeSelector]="[10, 25, 50]"
        [loading]="loading()"
        [animateRows]="true"
        (gridReady)="onGridReady($event)"
      />
    </div>
  </main>
</div>
