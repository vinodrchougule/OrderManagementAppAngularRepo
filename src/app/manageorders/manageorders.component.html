<div class="page-wrapper">
  <app-header></app-header>

  <main class="page-content">
    <h2 class="page-title">Manage Orders</h2>

    <div class="orders-toolbar">
      <div class="search-group">
        <input
          type="text"
          class="search-input"
          placeholder="Search orders..."
          [value]="quickFilterText()"
          (input)="onQuickFilterInput($any($event.target).value)"
        />
        <button type="button" class="toolbar-btn" (click)="onClearSearch()">
          <i class="bi bi-eraser-fill icon-teal" aria-hidden="true"></i>
          Clear
        </button>
      </div>

      <div class="toolbar-actions">
        <button type="button" class="toolbar-btn primary" (click)="onCreateNewOrder()">
          <i class="bi bi-plus-circle-fill" aria-hidden="true"></i>
          Create New Order
        </button>

        <div class="columns-menu">
          <button type="button" class="toolbar-btn" (click)="toggleColumnsMenu()">
            <i class="bi bi-layout-three-columns icon-indigo" aria-hidden="true"></i>
            Columns
          </button>
          @if (columnsMenuOpen()) {
          <div class="columns-panel">
            @for (col of toggleableColumns(); track col.colId) {
            <label class="columns-panel-item">
              <input
                type="checkbox"
                [checked]="col.visible"
                (change)="onToggleColumn(col.colId, $any($event.target).checked)"
              />
              {{ col.label }}
            </label>
            }
          </div>
        }
        </div>

        <button type="button" class="toolbar-btn primary" (click)="onExportExcel()">
          <i class="bi bi-file-earmark-excel-fill" aria-hidden="true"></i>
          Export to Excel
        </button>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        class="orders-grid"
        [theme]="theme"
        [rowModelType]="rowModelType"
        [datasource]="datasource"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="paginationPageSize"
        [cacheBlockSize]="cacheBlockSize"
        [paginationPageSizeSelector]="[10, 25, 50]"
        [domLayout]="'autoHeight'"
        [loading]="loading()"
        [animateRows]="true"
        (gridReady)="onGridReady($event)"
        (paginationChanged)="onPaginationChanged($event)"
      />
    </div>

    <!-- Create New Order modal - shown only while createOrderModalOpen() is true -->
    @if (createOrderModalOpen()) {
    <app-create-order-modal
      (closed)="onCreateOrderModalClosed()"
      (saved)="onOrderSaved($event)"
    ></app-create-order-modal>
    }

    <!-- View Order modal - shown only while viewOrderModalOpen() is true and an order is selected -->
    @if (viewOrderModalOpen() && selectedOrder(); as order) {
    <app-view-order-modal
      [order]="order"
      (closed)="onViewOrderModalClosed()"
      (editOrder)="onEditOrderFromView($event)"
    ></app-view-order-modal>
    }

    <!-- Edit Order modal - shown only while editOrderModalOpen() is true and an order is selected -->
    @if (editOrderModalOpen() && selectedOrder(); as order) {
    <app-edit-order-modal
      [order]="order"
      (closed)="onEditOrderModalClosed()"
    ></app-edit-order-modal>
    }
  </main>
</div>
