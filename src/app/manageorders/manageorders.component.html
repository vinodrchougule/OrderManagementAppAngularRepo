<div class="page-wrapper">
  <app-header></app-header>

  <main class="page-content">
    <h2 class="page-title">Manage Orders</h2>

    <div class="orders-toolbar">
      <div class="search-group">
        <input
          type="text"
          class="search-input"
          placeholder="Search orders..."
          [value]="quickFilterText()"
          (input)="onQuickFilterInput($any($event.target).value)"
        />
        <button type="button" class="toolbar-btn" (click)="onClearSearch()">Clear</button>
      </div>

      <div class="toolbar-actions">
        <button type="button" class="toolbar-btn primary" (click)="onCreateNewOrder()">
          <svg class="plus-icon" width="14" height="14" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z" fill="currentColor" />
          </svg>
          Create New Order
        </button>

        <div class="columns-menu">
          <button type="button" class="toolbar-btn" (click)="toggleColumnsMenu()">
            Columns
          </button>
          <div class="columns-panel" *ngIf="columnsMenuOpen()">
            <label *ngFor="let col of toggleableColumns()" class="columns-panel-item">
              <input
                type="checkbox"
                [checked]="col.visible"
                (change)="onToggleColumn(col.colId, $any($event.target).checked)"
              />
              {{ col.label }}
            </label>
          </div>
        </div>

        <button type="button" class="toolbar-btn primary" (click)="onExportExcel()">
          Export to Excel
        </button>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        class="orders-grid"
        [theme]="theme"
        [rowModelType]="rowModelType"
        [datasource]="datasource"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="paginationPageSize"
        [cacheBlockSize]="cacheBlockSize"
        [paginationPageSizeSelector]="[10, 25, 50]"
        [domLayout]="'autoHeight'"
        [loading]="loading()"
        [animateRows]="true"
        (gridReady)="onGridReady($event)"
        (paginationChanged)="onPaginationChanged($event)"
      />
    </div>

    <!-- Create New Order modal - shown only while createOrderModalOpen() is true -->
    <app-create-order-modal
      *ngIf="createOrderModalOpen()"
      (closed)="onCreateOrderModalClosed()"
      (saved)="onOrderSaved($event)"
    ></app-create-order-modal>

    <!-- View Order modal - shown only while viewOrderModalOpen() is true and an order is selected -->
    <app-view-order-modal
      *ngIf="viewOrderModalOpen() && selectedOrder() as order"
      [order]="order"
      (closed)="onViewOrderModalClosed()"
      (editOrder)="onEditOrderFromView($event)"
    ></app-view-order-modal>

    <!-- Edit Order modal - shown only while editOrderModalOpen() is true and an order is selected -->
    <app-edit-order-modal
      *ngIf="editOrderModalOpen() && selectedOrder() as order"
      [order]="order"
      (closed)="onEditOrderModalClosed()"
    ></app-edit-order-modal>
  </main>
</div>
