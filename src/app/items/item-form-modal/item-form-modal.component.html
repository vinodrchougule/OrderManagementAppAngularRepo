<div class="modal-backdrop" (appBackdropClose)="onCancel()">
  <div class="modal-card" appDraggableModal>
    <div class="modal-header">
      <h3>{{ isEdit ? 'Edit Item' : 'Create New Item' }}</h3>
      <button type="button" class="icon-close-btn" title="Close" (click)="onCancel()"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form" class="header-fields">
        @if (isEdit) {
        <div class="form-group">
          <label>Item Id</label>
          <input type="text" class="form-input" [value]="item!.itemId" readonly />
        </div>
        }

        <div class="form-group">
          <label>Item Name <span class="required-mark">*</span></label>
          <input type="text" class="form-input" formControlName="itemName" placeholder="Enter item name" />
          @if (submitted() && f['itemName'].invalid) {
          <span class="error-text">
            Item Name is required.
          </span>
          }
        </div>
      </form>

      @if (saveError()) {
      <span class="error-text">{{ saveError() }}</span>
      }
      @if (saveSuccessMessage()) {
      <span class="success-text">{{ saveSuccessMessage() }}</span>
      }
    </div>

    <div class="modal-footer">
      @if (!saveSuccessMessage()) {
      <button type="button" class="toolbar-btn primary" [disabled]="saving()" (click)="onSave()">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        {{ saving() ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" class="toolbar-btn" [disabled]="saving()" (click)="onCancel()">
        <i class="bi bi-x-circle icon-gray" aria-hidden="true"></i>
        Cancel
      </button>
      } @else {
      <button type="button" class="toolbar-btn primary" (click)="onCancel()">
        <i class="bi bi-check2-circle" aria-hidden="true"></i>
        Close
      </button>
      }
    </div>
  </div>
</div>
