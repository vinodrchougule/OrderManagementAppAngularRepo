<div class="modal-backdrop" (appBackdropClose)="onCancel()">
  <div class="modal-card" appDraggableModal>
    <div class="modal-header">
      <h3>{{ isEdit ? 'Edit Item' : 'Create New Item' }}</h3>
      <button type="button" class="icon-close-btn" title="Close" (click)="onCancel()">✕</button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form" class="header-fields">
        <div class="form-group" *ngIf="isEdit">
          <label>Item Id</label>
          <input type="text" class="form-input" [value]="item!.itemId" readonly />
        </div>

        <div class="form-group">
          <label>Item Name <span class="required-mark">*</span></label>
          <input type="text" class="form-input" formControlName="itemName" placeholder="Enter item name" />
          <span class="error-text" *ngIf="submitted() && f['itemName'].invalid">
            Item Name is required.
          </span>
        </div>
      </form>

      <span class="error-text" *ngIf="saveError()">{{ saveError() }}</span>
      <span class="success-text" *ngIf="saveSuccessMessage()">{{ saveSuccessMessage() }}</span>
    </div>

    <div class="modal-footer">
      <ng-container *ngIf="!saveSuccessMessage(); else closeOnlyFooter">
        <button type="button" class="toolbar-btn primary" [disabled]="saving()" (click)="onSave()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
        <button type="button" class="toolbar-btn" [disabled]="saving()" (click)="onCancel()">Cancel</button>
      </ng-container>
      <ng-template #closeOnlyFooter>
        <button type="button" class="toolbar-btn primary" (click)="onCancel()">Close</button>
      </ng-template>
    </div>
  </div>
</div>
