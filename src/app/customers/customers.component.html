<div class="page-wrapper">
  <app-header></app-header>

  <main class="page-content">
    <h2 class="page-title">Customers</h2>

    <div class="customers-toolbar">
      <div class="search-group">
        <input
          type="text"
          class="search-input"
          placeholder="Search customers..."
          [value]="quickFilterText()"
          (input)="onQuickFilterInput($any($event.target).value)"
        />
        <button type="button" class="toolbar-btn" (click)="onClearSearch()">
          <i class="bi bi-eraser-fill icon-teal" aria-hidden="true"></i>
          Clear
        </button>
      </div>

      <div class="toolbar-actions">
        <button type="button" class="toolbar-btn primary" (click)="onCreateNewCustomer()">
          <i class="bi bi-plus-circle-fill" aria-hidden="true"></i>
          Create New Customer
        </button>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        class="customers-grid"
        [theme]="theme"
        [rowData]="rowData()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [quickFilterText]="quickFilterText()"
        [pagination]="true"
        [paginationPageSize]="10"
        [paginationPageSizeSelector]="[10, 25, 50]"
        [domLayout]="'autoHeight'"
        [loading]="loading()"
        [animateRows]="true"
      />
    </div>

    <!-- Create/Edit Customer modal - shown only while formModalOpen() is true -->
    @if (formModalOpen()) {
    <app-customer-form-modal
      [customer]="editingCustomer()"
      (closed)="onFormModalClosed()"
    ></app-customer-form-modal>
    }
  </main>
</div>

<!-- Delete confirmation - a top-level overlay, shown only while confirmDeleteOpen() is true -->
@if (confirmDeleteOpen()) {
<div class="confirm-overlay" (appBackdropClose)="onConfirmDeleteNo()">
  <div class="confirm-box">
    @if (!deleteSuccessMessage()) {
    <p class="confirm-message">Are you sure, to delete this Customer?</p>
    @if (deleteError()) {
    <span class="error-text">{{ deleteError() }}</span>
    }
    <div class="confirm-actions">
      <button type="button" class="toolbar-btn danger" [disabled]="deleting()" (click)="onConfirmDeleteYes()">
        <i class="bi bi-trash-fill" aria-hidden="true"></i>
        {{ deleting() ? 'Deleting...' : 'Yes' }}
      </button>
      <button type="button" class="toolbar-btn" [disabled]="deleting()" (click)="onConfirmDeleteNo()">
        <i class="bi bi-x-circle icon-gray" aria-hidden="true"></i>
        No
      </button>
    </div>
    } @else {
    <p class="confirm-message success-text">{{ deleteSuccessMessage() }}</p>
    }
  </div>
</div>
}
